{% macro production_card_styles() %}
<style>
    .production-list-shell {
        position: relative;
        margin-bottom: 24px;
    }

    .production-list {
        display: flex;
        gap: 10px;
        margin: -10px 0 0 0;
        padding: 2px 2px 10px;
        overflow-x: auto;
        scrollbar-color: var(--line) transparent;
        scrollbar-width: thin;
    }

    .production-list::-webkit-scrollbar {
        height: 6px;
    }

    .production-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .production-list::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: var(--line);
    }

    .production-list > * {
        flex: 0 0 240px;
        width: 240px;
        max-width: 100%;
    }

    .production-card {
        min-height: 184px;
        padding: 14px;
        border-left: 4px solid var(--teal);
        border-radius: 2px 8px 8px 2px;
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(23, 37, 43, 0.06);
    }

    .production-card span,
    .production-card strong {
        display: block;
    }

    .production-card { overflow-wrap: anywhere; }
    .production-card p { margin: 8px 0 0; font-size: 0.78rem; }
    .production-card small { display: block; margin-top: 8px; color: var(--muted); font-size: 0.68rem; }
    .production-card .production-done { display: inline; color: #287647; text-transform: none; }
    .observation-card { border-color: #297fa3; }
    .error-card { border-color: #c14636; }
    .production-list .production-empty { flex: 1; width: auto; margin: 0; padding: 20px 0; color: var(--muted); }

    .production-card span {
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
    }

    .production-card strong {
        margin-top: 8px;
        font-size: 0.88rem;
    }

    @media (prefers-reduced-motion: reduce) {
        .production-list {
            scroll-behavior: auto;
        }
    }
</style>
{% endmacro %}

{% macro production_card(region, robots) %}
<article class="production-card">
    <span>{{ region }}</span>
    <strong>{{ robots }}</strong>
</article>
{% endmacro %}
