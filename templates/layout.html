<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InteliEsteira{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #17252b;
            --muted: #64747b;
            --paper: #f4f6f3;
            --surface: #ffffff;
            --line: #dfe6e3;
            --orange: #ff8152;
            --teal: #349296;
            --green: #51b878;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 90% 0%, #e2efea 0, transparent 34%), var(--paper);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .dashboard-container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .main-navbar {
            width: fit-content;
            max-width: calc(100% - 24px);
            margin: 18px auto 0;
        }

        .navbar-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 10px 28px rgba(23, 37, 43, 0.08);
            backdrop-filter: blur(12px);
        }

        .main-navbar .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 11px 20px;
            border-radius: 999px;
            color: var(--ink);
            font-size: 0.84rem;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
            transition: min-width 0.25s ease, min-height 0.25s ease, padding 0.25s ease,
                background 0.25s ease, border-radius 0.25s ease, color 0.25s ease;
        }

        .main-navbar .nav-item i {
            display: none;
            font-size: 1.65rem;
            color: var(--ink);
        }

        .main-navbar .nav-item.active {
            background: var(--orange);
        }

        .main-navbar.theme-dashboard .nav-item.active {
            background: var(--green);
        }

        .main-navbar.theme-connection .nav-item.active {
            background: var(--teal);
        }

        .main-navbar.theme-production .nav-item.active {
            background: var(--orange);
        }

        .main-navbar .nav-item.active,
        .main-navbar .nav-item.active i {
            color: white;
        }

        .navbar-container:hover {
            gap: 4px;
        }

        .navbar-container:hover .nav-item {
            flex-direction: column;
            min-width: 145px;
            min-height: 104px;
            padding: 16px;
            border-radius: 18px;
        }

        .navbar-container:hover .nav-item i {
            display: block;
            margin-bottom: 12px;
        }

        .navbar-container:hover .nav-item.theme-dashboard.active,
        .navbar-container:hover .nav-item.theme-dashboard.active i {
            color: var(--green);
        }

        .navbar-container:hover .nav-item.theme-connection.active,
        .navbar-container:hover .nav-item.theme-connection.active i {
            color: var(--teal);
        }

        .navbar-container:hover .nav-item.theme-production.active,
        .navbar-container:hover .nav-item.theme-production.active i {
            color: var(--orange);
        }

        .navbar-container:hover .nav-item.active {
            background: #f1eff4;
        }

        .navbar-container:hover .nav-item:hover,
        .navbar-container:hover .nav-item.active:hover {
            background: #eae7ee;
        }

        @media (max-width: 820px) {
            .main-navbar .nav-item {
                padding: 9px 14px;
                font-size: 0.76rem;
            }

            .navbar-container:hover .nav-item {
                min-width: 110px;
                min-height: 92px;
                padding: 12px;
            }
        }

        @media (hover: none) {
            .main-navbar {
                width: calc(100% - 24px);
            }

            .navbar-container {
                flex-wrap: wrap;
                justify-content: center;
            }

            .main-navbar .nav-item {
                flex: 1 1 130px;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="main-navbar 
        {% if request.endpoint == 'pages.dashboard' %}
        theme-dashboard{% elif request.endpoint == 'pages.connection' %}
        theme-connection{% elif request.endpoint == 'pages.production' %}
        theme-production{% endif %}" aria-label="Navegação principal">
        <div class="navbar-container">
            <a class="nav-item theme-dashboard {% if request.endpoint == 'pages.dashboard' %}active{% endif %}"
               href="{{ url_for('pages.dashboard') }}"
               {% if request.endpoint == 'pages.dashboard' %}aria-current="page"{% endif %}>
                <i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>
                <span>Dashboard</span>
            </a>
            <a class="nav-item theme-connection {% if request.endpoint == 'pages.connection' %}active{% endif %}"
               href="{{ url_for('pages.connection') }}"
               {% if request.endpoint == 'pages.connection' %}aria-current="page"{% endif %}>
                <i class="bi bi-usb-plug-fill" aria-hidden="true"></i>
                <span>Conexão</span>
            </a>
            <a class="nav-item theme-production {% if request.endpoint == 'pages.production' %}active{% endif %}"
               href="{{ url_for('pages.production') }}"
               {% if request.endpoint == 'pages.production' %}aria-current="page"{% endif %}>
                <i class="bi bi-basket2-fill" aria-hidden="true"></i>
                <span>Linha de produção</span>
            </a>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
