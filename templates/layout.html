<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InteliEsteira{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #17252b;
            --muted: #64747b;
            --paper: #f4f6f3;
            --surface: #ffffff;
            --line: #dfe6e3;
            --orange: #ff8152;
            --teal: #168c91;
            --green: #3f9b57;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 90% 0%, #e2efea 0, transparent 34%), var(--paper);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .dashboard-container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .app-navbar {
            min-height: 76px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--ink);
            font-size: 1.1rem;
            font-weight: 800;
        }

        .brand-icon {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border-radius: 10px;
            background: var(--orange);
            color: white;
        }

        .nav-link {
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 700;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--teal);
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container-fluid dashboard-container">
            <a class="navbar-brand brand-mark" href="{{ url_for('pages.dashboard') }}">
                <span class="brand-icon"><i class="bi bi-box-seam-fill"></i></span>
                <span>InteliEsteira</span>
            </a>
            <button 
                class="navbar-toggler" 
                type="button" data-bs-toggle="collapse" data-bs-target="#main-navigation" 
                aria-controls="main-navigation">
                <i class="bi bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="main-navigation">
                <ul class="navbar-nav ms-auto gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'pages.dashboard' %}active{% endif %}" href="{{ url_for('pages.dashboard') }}">
                            <i class="bi bi-grid-1x2-fill"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'pages.connection' %}active{% endif %}" href="{{ url_for('pages.connection') }}">
                            <i class="bi bi-usb-plug-fill"></i> Conexão
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'pages.production' %}active{% endif %}" href="{{ url_for('pages.production') }}">
                            <i class="bi bi-box-seam-fill"></i> Linha de produção
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
